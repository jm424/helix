syntax = "proto3";
package kafkaadmin;

// Kafka admin gRPC service for topic lifecycle management.
//
// Implements the kafkaadmin.Resources API for creating, describing, and
// deleting topics. Runs on port 8090 alongside the primary Kafka protocol
// server.
service Resources {
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);
  rpc TagTopics(TagTopicsRequest) returns (TagTopicsResponse);
  rpc DeleteTopic(DeleteTopicRequest) returns (DeleteTopicResponse);
  rpc DeleteConsumerGroups(DeleteConsumerGroupsRequest) returns (DeleteConsumerGroupsResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc DescribeTopics(DescribeTopicsRequest) returns (DescribeTopicsResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  rpc GetTopicState(GetTopicStateRequest) returns (GetTopicStateResponse);
  rpc GetTopicStates(GetTopicStatesRequest) returns (GetTopicStatesResponse);
}

message CreateTopicRequest {
  int32 partition_count = 1;
  int32 replication_factor = 2;
  string topic_name = 3;
  map<string, string> config = 4;
  map<string, string> tags = 5;
  bool force = 6;
}
message CreateTopicResponse {}

message DescribeTopicRequest {
  string topic_name = 1;
}
message DescribeTopicResponse {
  int32 partition_count = 1;
  int32 replication_factor = 2;
  map<string, string> config = 3;
  map<string, string> tags = 4;
}

message TopicTag {
  string topic = 1;
  map<string, string> tags = 2;
}
message TagTopicsRequest {
  repeated TopicTag topic_tags = 1;
}
message TagTopicsResponse {}

message DeleteTopicRequest {
  string topic_name = 1;
  bool force = 3;
}
message DeleteTopicResponse {}

message DeleteConsumerGroupsRequest {
  repeated string consumer_group_names = 1;
}
message DeleteConsumerGroupsResponse {}

// --- RPCs for topic listing and describe ---

message ListTopicsRequest {
  string pool_name = 1;
  map<string, string> tags = 2;
  bool internal = 3;
}
message ListTopicsResponse {
  repeated string topic_names = 1;
}

// Simplified TopicConfig inlined from kafka.TopicConfig (common.proto).
// Field numbers match the real proto for wire compatibility.
message TopicConfig {
  int32 partition_count = 1;
  int32 replication_factor = 2;
  map<string, string> config = 3;
}

message TopicDescription {
  TopicConfig topic_config = 1;
  map<string, string> tags = 2;
}

message DescribeTopicsRequest {
  repeated string topic_names = 1;
}
message DescribeTopicsResponse {
  map<string, TopicDescription> topics = 1;
}

message BrokersUp {
  int32 total = 1;
  int32 up = 2;
}

message GetHealthRequest {}
message GetHealthResponse {
  bool is_healthy = 1;
  map<string, BrokersUp> brokers_up = 2;
}

message TopicState {
  int32 partition_count = 1;
  bool is_optimally_placed = 2;
  bool spans_usable_brokers = 3;
  bool has_out_of_sync_replicas = 4;
  bool has_under_replicated_partitions = 5;
}

message GetTopicStateRequest {
  string topic_name = 1;
}
message GetTopicStateResponse {
  TopicState topic_state = 1;
}

message GetTopicStatesRequest {
  bool include_usage = 1;
}
message GetTopicStatesResponse {
  map<string, TopicState> topic_states = 1;
}
